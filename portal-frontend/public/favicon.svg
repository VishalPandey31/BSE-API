<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bseBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="bullGrad" x1="0" y1="64" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bseBg)" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Candlestick wicks -->
  <line x1="18" y1="26" x2="18" y2="50" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="18" x2="32" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="46" y1="12" x2="46" y2="50" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Candlestick bodies -->
  <!-- Bar 1 (Purple) -->
  <rect x="13.5" y="32" width="9" height="12" rx="2.5" fill="#6366f1"/>
  <!-- Bar 2 (Cyan) -->
  <rect x="27.5" y="24" width="9" height="18" rx="2.5" fill="#38bdf8"/>
  <!-- Bar 3 (Emerald Green - Bull) -->
  <rect x="41.5" y="16" width="9" height="24" rx="2.5" fill="url(#bullGrad)"/>

  <!-- Trendline curve with bright apex point -->
  <path d="M 12 40 Q 28 32 40 19 T 54 11" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="54" cy="11" r="3.5" fill="#34d399" filter="url(#glow)"/>
  <circle cx="54" cy="11" r="1.5" fill="#ffffff"/>
</svg>